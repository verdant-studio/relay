name: Build release zip

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer

      - name: Install dependencies and wrap them
        run: composer install

      - name: Remove dev dependencies and optimize autoloader
        run: composer update --no-dev --no-scripts --optimize-autoloader

      - name: Install Subversion
        run: sudo apt-get install -y subversion

      - name: Generate zip
        uses: 10up/action-wordpress-plugin-build-zip@b9e621e1261ccf51592b6f3943e4dc4518fca0d1 # 1.0.2
        with:
          retention-days: 1
